# Met le manifeste à jour quand une release est réellement publiée.
#
# Ce workflow existe pour corriger un ordre fautif. Le dépôt du code créait la
# release **et** écrivait le manifeste dans la foulée — mais une release en
# brouillon ne crée pas son tag. Le manifeste annonçait donc une adresse qui
# rendait 404 tant que personne n'avait cliqué sur « Publish release ».
#
# Déclenché par `release: published`, il n'écrit qu'au moment où la page
# qu'il désigne devient réelle. La fenêtre pendant laquelle le manifeste
# pouvait mentir n'existe plus.
#
# ## Deux manifestes
#
# `latest.json` annonce les versions publiées, `evocati.json` les
# préversions. Deux fichiers plutôt qu'un seul à deux champs : le canal LIVE
# ne doit pas même télécharger le numéro d'une préversion, et une erreur d'un
# côté ne peut rien casser de l'autre.
#
# Une release normale n'écrit que `latest.json`. Une préversion n'écrit que
# `evocati.json`.
#
# ## Le manifeste signé
#
# `update-live.json` et `update-evocati.json` portent, en plus du numéro,
# l'adresse de l'installeur et sa **signature**. C'est ce que lit le module
# qui installe depuis l'application : il refuse tout fichier dont la signature
# n'est pas celle du projet.
#
# La signature est produite à la construction, voyage comme un fichier joint
# à la release, et n'est recopiée ici qu'une fois la release publiée — donc
# une fois que l'adresse de l'installeur est stable. Les adresses d'un
# brouillon changent au moment de la publication.
#
# Il utilise le jeton que GitHub fournit à ce dépôt : aucun secret
# supplémentaire, et aucun accès au dépôt du code source.
name: Manifeste

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: manifeste
  cancel-in-progress: false

jobs:
  annoncer:
    name: Annoncer la version publiée
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `ref: main` explicitement. Sur un evenement `release`, checkout se
      # place sur le tag, donc en HEAD detachee : le commit passait et le
      # `git push` echouait sur « You are not currently on a branch ». Le
      # manifeste n'a jamais ete ecrit tant que ce workflow n'avait pas eu de
      # release publiee a traiter.
      - name: Récupérer le dépôt
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Écrire le manifeste
        env:
          TAG: ${{ github.event.release.tag_name }}
          PAGE: ${{ github.event.release.html_url }}
          BROUILLON: ${{ github.event.release.draft }}
          PREVERSION: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Ceinture et bretelles : l'événement `published` ne porte pas de
          # brouillon, mais annoncer un brouillon enverrait tout le monde sur
          # une page qui n'existe pas.
          if [ "$BROUILLON" = "true" ]; then
            echo "brouillon : aucun manifeste touché"
            exit 0
          fi

          # Une préversion ne touche jamais le manifeste du canal LIVE.
          if [ "$PREVERSION" = "true" ]; then
            cible=evocati.json
          else
            cible=latest.json
          fi

          # Le numéro annoncé est celui que l'installeur déclare, et non celui
          # du tag. La signature de la mise à jour couvre le premier ; les
          # faire diverger fait échouer l'installation sur une alerte de
          # falsification, ce qui est le comportement correct du module.
          #
          # Le suffixe du tag choisit le canal, pas la version. Deux
          # préversions d'un même socle ne sont donc pas distinguables par le
          # module : on incrémente le socle plutôt que le suffixe.
          version="${TAG#v}"
          version="${version%%-*}"
          cat > "$cible" <<JSON
          {
            "version": "${version}",
            "releaseUrl": "${PAGE}"
          }
          JSON
          echo "écrit dans $cible :"
          cat "$cible"

          # --- le manifeste signé, pour l'installation depuis l'application ---
          if [ "$PREVERSION" = "true" ]; then
            signe=update-evocati.json
          else
            signe=update-live.json
          fi

          installeur=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name | endswith("x64-setup.exe")) | .url')
          nom_sig=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name | endswith("x64-setup.exe.sig")) | .name')

          if [ -z "$installeur" ] || [ -z "$nom_sig" ]; then
            echo "::warning::Pas d'installeur signé sur cette release : $signe inchangé."
            echo "L'installation depuis l'application restera indisponible pour $version."
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$nom_sig" --dir . --clobber
            signature=$(cat "$nom_sig")
            rm -f "$nom_sig"

            # `notes` reste court : la page de la release porte le détail, et
            # le module n'affiche qu'une ligne.
            cat > "$signe" <<JSON
          {
            "version": "${version}",
            "notes": "StarTrace ${version}. Le détail figure sur la page de la release.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${signature}",
                "url": "${installeur}"
              }
            }
          }
          JSON
            echo "écrit dans $signe :"
            cat "$signe"
          fi

      - name: Publier le manifeste
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "Rooot3301"
          git config user.email "romainvarene06@gmail.com"
          git add latest.json evocati.json update-live.json update-evocati.json
          if git diff --cached --quiet; then
            echo "manifeste déjà à jour"
            exit 0
          fi
          git commit -m "Annoncer la version ${TAG#v}"
          # La destination est nommee : si la recuperation retombait un jour
          # en HEAD detachee, l'echec serait silencieux a la ligne d'avant.
          git push origin HEAD:main
